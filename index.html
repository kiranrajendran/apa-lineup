<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>APA 9-Ball Tools</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181b;--muted:#6d727a;--border:#e2e5e9;--accent:#1f6feb;--accent2:#eaf2ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center}
.app{width:100%;max-width:560px;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 6px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 28px}
.menu{display:grid;gap:14px}
.tool{display:flex;align-items:center;gap:16px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:18px;text-decoration:none;color:inherit;box-shadow:0 1px 2px #0000000a;transition:transform .12s,box-shadow .12s,border-color .12s}
.tool:hover,.tool:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px #1f6feb22;outline:none}
.tool:active{transform:scale(.99)}
.icon{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:var(--accent2)}
.tool.primary .icon{background:var(--accent);color:#fff}
.text{flex:1;min-width:0}
.text b{display:block;font-size:1.1rem;margin-bottom:3px}
.text span{color:var(--muted);font-size:.9rem}
.arrow{color:var(--accent);font-size:1.5rem;font-weight:700}
</style>
</head>
<body>
<main class="app">
<h1>APA 9-Ball Tools</h1>
<p class="sub">Pick a tool to get started.</p>
<nav class="menu">
<a class="tool primary" href="apa-lineup-generator.html">
<div class="icon" aria-hidden="true">&#9776;</div>
<div class="text"><b>Lineup Generator</b><span>Find every legal 5-player lineup under the skill cap.</span></div>
<div class="arrow" aria-hidden="true">&rsaquo;</div>
</a>
<a class="tool" href="apa-9ball-scorekeeper.html">
<div class="icon" aria-hidden="true">&#9679;</div>
<div class="text"><b>Scorekeeper</b><span>Track balls, innings and defenses, then export a score sheet.</span></div>
<div class="arrow" aria-hidden="true">&rsaquo;</div>
</a>
</nav>
</main>
</body>
</html>
