<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APA 9-Ball Lineup Generator</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181b;--muted:#6d727a;--border:#e2e5e9;--accent:#1f6feb;--accent2:#eaf2ff;--danger:#b42318;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:780px;margin:auto;padding:18px 14px 48px}h1{font-size:1.6rem;margin:4px 0 5px}.sub,.hint,.detail{color:var(--muted)}.sub{margin:0 0 18px;font-size:.95rem}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab,.reset{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-weight:750}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.mode{display:none}.mode.active{display:block}.hint{font-size:.82rem;margin:0 0 10px}.roster-grid,.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 13px;text-align:left}.player-btn.selected{background:var(--accent2);border-color:var(--accent)}.player-name{font-weight:800}.skill-pill{font-size:.8rem;font-weight:800;padding:5px 8px;border-radius:999px}
.skill-pill.sl-3{background:#e8f5e9;color:#2e7d32}
.skill-pill.sl-4{background:#e3f2fd;color:#1565c0}
.skill-pill.sl-5{background:#fff3e0;color:#ef6c00}
.skill-pill.sl-6{background:#fce4ec;color:#c2185b}.check{display:none;font-weight:900;color:var(--accent);margin-right:6px}.player-btn.selected .check{display:inline}.skill{border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}.skill .label{font-weight:800;font-size:1.15rem}.counter{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:6px;margin-top:10px}.counter button{width:38px;height:38px;border:0;border-radius:10px;background:var(--accent2);color:var(--accent);font-size:1.4rem;font-weight:700}.count{font-size:1.25rem;font-weight:800}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.controls label{font-size:.9rem;color:var(--muted)}input[type=number]{width:72px;padding:9px;border:1px solid var(--border);border-radius:9px;font:inherit}.toggle{display:flex;align-items:center;gap:8px}.reset{margin-left:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fafafa;border:1px solid var(--border);padding:10px;border-radius:12px;text-align:center}.metric b{display:block;font-size:1.3rem}.metric span{font-size:.78rem;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:18px 2px 8px}.section-title h2{font-size:1.1rem;margin:0}.section-title span{font-size:.82rem;color:var(--muted)}.lineup{padding:13px;border-bottom:1px solid var(--border)}.lineup:last-child{border-bottom:0}.lineup-head{display:flex;align-items:center;gap:10px}.total{width:43px;height:43px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:850;flex:0 0 auto}.skills{font-weight:800}.badge{margin-left:auto;background:var(--accent2);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:.76rem;font-weight:700}.named-lines{margin:9px 0 0 53px;display:grid;gap:6px}.named-line{font-size:.9rem;padding:7px 9px;background:#fafafa;border-radius:8px}.replay-tag{font-size:.72rem;font-weight:800;color:var(--accent);margin-left:5px}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.warning{color:var(--danger);font-size:.88rem;margin-top:10px}code{background:#f0f1f3;padding:2px 5px;border-radius:5px}@media(max-width:560px){.roster-grid,.players{grid-template-columns:repeat(2,1fr)}.app{padding-left:10px;padding-right:10px}.card{padding:13px}.named-lines{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<h1>APA 9-Ball Lineup Generator</h1>
<p class="sub">Choose your available players or use Generic mode to test hypothetical rosters.</p>
<div class="card">
<div class="tabs"><button class="tab active" id="teamTab">My Team</button><button class="tab" id="genericTab">Generic</button></div>
<div id="teamMode" class="mode active"><p class="hint">Edit the <code>roster</code> array near the top of the JavaScript whenever your team changes.</p><div class="roster-grid" id="rosterGrid"></div></div>
<div id="genericMode" class="mode"><div class="players" id="players"></div></div>
<div class="controls"><label>Max cap <input id="cap" type="number" min="1" max="50" value="23"></label><label>Min total <input id="minCap" type="number" min="0" max="50" value="0"></label><label class="toggle"><input id="replay" type="checkbox"> Allow one player to replay</label><button class="reset" id="reset">Reset</button></div><div id="warning" class="warning"></div>
</div>
<div class="card"><div class="summary"><div class="metric"><b id="available">0</b><span>Players available</span></div><div class="metric"><b id="distinct">0</b><span>Distinct skill lineups</span></div><div class="metric"><b id="best">—</b><span>Best total</span></div></div></div>
<div class="section-title"><h2>Optimal lineups</h2><span>Highest total first</span></div><div class="card" id="results"></div>
</div>
<script>
// ==========================================================
// EDIT YOUR TEAM ROSTER HERE
// Change names/skills or add/remove rows as your team changes.
// ==========================================================
const roster = [
  { name: "Dave", skill: 3 },
  { name: "Stacey", skill: 3 },
  { name: "Dennis", skill: 4 },
  { name: "Larry", skill: 4 },
  { name: "Ron",  skill: 4 },
  { name: "Jen",   skill: 5 },
  { name: "Caleb",  skill: 6 },
  { name: "Kiran",  skill: 6 },
];
// ==========================================================
const skillLevels=[3,4,5,6],genericCounts={3:0,4:0,5:0,6:0},selectedPlayers=new Set();let mode='team';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderRoster(){const root=document.getElementById('rosterGrid');root.innerHTML='';roster.forEach((p,i)=>{const b=document.createElement('button');b.className='player-btn';b.innerHTML=`<span><span class="check">✓</span><span class="player-name">${esc(p.name)}</span></span><span class="skill-pill sl-${p.skill}">SL${p.skill}</span>`;b.onclick=()=>{selectedPlayers.has(i)?selectedPlayers.delete(i):selectedPlayers.add(i);b.classList.toggle('selected',selectedPlayers.has(i));calculate()};root.appendChild(b)})}
function renderCounters(){const root=document.getElementById('players');root.innerHTML='';skillLevels.forEach(s=>{const d=document.createElement('div');d.className='skill';d.innerHTML=`<div class="label">Skill ${s}</div><div class="counter"><button data-s="${s}" data-d="-1">−</button><div class="count" id="count-${s}">${genericCounts[s]}</div><button data-s="${s}" data-d="1">+</button></div>`;root.appendChild(d)});root.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{const s=+b.dataset.s,d=+b.dataset.d;genericCounts[s]=Math.max(0,genericCounts[s]+d);document.getElementById(`count-${s}`).textContent=genericCounts[s];calculate()})}
function combArr(arr,k){const out=[];function r(start,c){if(c.length===k){out.push([...c]);return}for(let i=start;i<=arr.length-(k-c.length);i++){c.push(arr[i]);r(i+1,c);c.pop()}}r(0,[]);return out}
function countComb(src,k){const out=[];function r(i,rem,c){if(i===skillLevels.length){if(!rem)out.push({...c});return}const s=skillLevels[i],mx=Math.min(src[s]||0,rem);for(let n=0;n<=mx;n++){c[s]=n;r(i+1,rem-n,c)}}r(0,k,{});return out}
const countsFromSkills=a=>{const c={3:0,4:0,5:0,6:0};a.forEach(s=>c[s]++);return c}, key=c=>skillLevels.map(s=>`${s}:${c[s]||0}`).join('|'), arrFromCounts=c=>[...skillLevels].sort((a,b)=>b-a).flatMap(s=>Array(c[s]||0).fill(s)), total=c=>skillLevels.reduce((x,s)=>x+s*(c[s]||0),0);
function teamLineups(players,cap,min,replay){const g=new Map();const add=(five,replayId=null)=>{const skills=five.map(p=>p.skill),c=countsFromSkills(skills),t=skills.reduce((a,b)=>a+b,0);if(t<min||t>cap)return;const k=key(c);if(!g.has(k))g.set(k,{combo:c,total:t,named:[]});g.get(k).named.push({players:five,replayId})};combArr(players,5).forEach(x=>add(x));if(replay)combArr(players,4).forEach(base=>base.forEach(p=>add([...base,p],p.id)));return [...g.values()]}
function genericLineups(c,cap,min,replay){const g=new Map();countComb(c,5).forEach(x=>{const t=total(x);if(t>=min&&t<=cap)g.set(key(x),{combo:x,total:t,replaySkills:new Set})});if(replay)countComb(c,4).forEach(base=>skillLevels.forEach(s=>{if(!(base[s]>0))return;const x={...base,[s]:(base[s]||0)+1},t=total(x);if(t<min||t>cap)return;const k=key(x);if(!g.has(k))g.set(k,{combo:x,total:t,replaySkills:new Set});g.get(k).replaySkills.add(s)}));return [...g.values()]}
function calculate(){const cap=+document.getElementById('cap').value||23,min=+document.getElementById('minCap').value||0,replay=document.getElementById('replay').checked;let n=0,lineups=[];if(mode==='team'){const ps=[...selectedPlayers].sort((a,b)=>a-b).map(i=>({...roster[i],id:i}));n=ps.length;lineups=teamLineups(ps,cap,min,replay)}else{n=skillLevels.reduce((a,s)=>a+genericCounts[s],0);lineups=genericLineups(genericCounts,cap,min,replay)}lineups.sort((a,b)=>b.total-a.total||arrFromCounts(b.combo).join('').localeCompare(arrFromCounts(a.combo).join('')));available.textContent=n;distinct.textContent=lineups.length;best.textContent=lineups.length?lineups[0].total:'—';warning.textContent=n<5&&!replay?'Fewer than 5 players selected. Enable replay if your local rules permit one player to play twice.':n<4&&replay?'At least 4 distinct players are needed when using one replay.':'';results.innerHTML=lineups.length?lineups.map((x,i)=>{const skills=arrFromCounts(x.combo).join(' + ');let named='',detail='Distinct skill combination';if(mode==='team'){const seen=new Set,rows=[];x.named.forEach(nm=>{const text=nm.players.slice().sort((a,b)=>b.skill-a.skill||a.name.localeCompare(b.name)).map(p=>`${esc(p.name)} (${p.skill})${nm.replayId===p.id?'<span class="replay-tag">REPLAY</span>':''}`).join(' • ');if(!seen.has(text)){seen.add(text);rows.push(text)}});detail=`${rows.length} actual player lineup${rows.length===1?'':'s'}`;named=`<div class="named-lines">${rows.map(r=>`<div class="named-line">${r}</div>`).join('')}</div>`}else if(x.replaySkills?.size){detail+=` • Replay possible: SL${[...x.replaySkills].sort().join(' or SL')}`}return `<div class="lineup"><div class="lineup-head"><div class="total">${x.total}</div><div><div class="skills">${skills}</div><div class="detail">${detail}</div></div>${i===0?'<div class="badge">BEST</div>':''}</div>${named}</div>`}).join(''):'<div class="empty">No valid lineups for the selected roster and cap.</div>'}
function setMode(m){mode=m;teamMode.classList.toggle('active',m==='team');genericMode.classList.toggle('active',m==='generic');teamTab.classList.toggle('active',m==='team');genericTab.classList.toggle('active',m==='generic');calculate()}
teamTab.onclick=()=>setMode('team');genericTab.onclick=()=>setMode('generic');cap.oninput=calculate;minCap.oninput=calculate;replay.onchange=calculate;reset.onclick=()=>{selectedPlayers.clear();skillLevels.forEach(s=>genericCounts[s]=0);cap.value=23;minCap.value=0;replay.checked=false;renderRoster();renderCounters();calculate()};renderRoster();renderCounters();calculate();
</script>
</body>
</html>
